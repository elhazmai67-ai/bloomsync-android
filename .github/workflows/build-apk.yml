name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'BloomSync-Android-GitHub.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.13'

      - name: Extract project ZIP
        run: python3 -m zipfile -e BloomSync-Android-GitHub.zip android-project

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Check and build APK
        working-directory: android-project/bloomsync-android
        run: |
          python3 tools/check_project.py
          gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp android-project/bloomsync-android/app/build/outputs/apk/debug/app-debug.apk output/BloomSync-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/BloomSync-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloomSync-APK
          path: output/BloomSync-preview.apk
          if-no-files-found: error
          retention-days: 30
